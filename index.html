  if(!/^[+-]?\d*[.,]?\d+$|^[+-]?\d{1,3}([,.]\d{3})+([.,]\d+)?$/.test(s))return null;
  if(/^[+-]?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,'');
  else if(/^[+-]?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');
  else s=s.replace(',','.');
  const n=parseFloat(s);return isFinite(n)?(neg?-n:n):null}
function xiTypeOf(v){const s=xiN(v);if(!s)return '';

  if(/^(расход|трат|списан|expense|out|покупк|минус|затрат|-)/.test(s))return 'expense';return ''}

function xiParse(sheets){
  const rowsOut=[];let skipped=0,found=false;
  for(const sh of sheets){
    if(/^(по категориям|по месяцам)$/i.test(sh.name||''))continue;const R=sh.rows;if(!R.length)continue;
    const H=xiHeader(R)||xiGuess(R);if(!H)continue;found=true;
    const m=H.map,data=R.slice(H.row+1);
    const hasNeg=data.some(r=>{const n=xiNum(r[m.amt]);return n!=null&&n<0});
    let lastDate='';
    for(const r of data){
      if(!r||!r.some(c=>c!==''&&c!=null))continue;
      let date=xiDate(r[m.date]);
      if(!date){skipped++;continue}
      let amt=null,type='';
      if(m.inc!=null||m.exp!=null){
        const a=m.inc!=null?xiNum(r[m.inc]):null,b=m.exp!=null?xiNum(r[m.exp]):null;
        if(a&&Math.abs(a)>0&&!(b&&Math.abs(b)>0)){amt=Math.abs(a);type='income'}
        else if(b&&Math.abs(b)>0&&!(a&&Math.abs(a)>0)){amt=Math.abs(b);type='expense'}
        else if(m.amt!=null){const n=xiNum(r[m.amt]);if(n!=null&&n!==0){amt=Math.abs(n);type=n<0?'expense':''}}}
      else{const n=xiNum(r[m.amt]);if(n!=null&&n!==0){amt=Math.abs(n);
        if(m.type!=null)type=xiTypeOf(r[m.type]);
        if(!type&&hasNeg)type=n<0?'expense':'income'}}
      if(!amt){skipped++;continue}
      rowsOut.push({date,amt:Math.round(amt*100)/100,type,cat:m.cat!=null?xiClean(r[m.cat]):'',note:m.note!=null?String(r[m.note]??'').trim():'',tags:m.tags!=null?String(r[m.tags]??''):''})}}
  return{rows:rowsOut,skipped,found}}

  const last=new Map(),busy=new Set();
  if(window.ResizeObserver){
    const ro=new ResizeObserver(es=>{if(window._fxLock){if(raf){cancelAnimationFrame(raf);raf=0}update()}else sched();es.forEach(en=>{const el=en.target;if(busy.has(el))return;
      if(window._fxLock){last.set(el,el.offsetHeight);return}
      const nh=el.offsetHeight,oh=last.get(el);last.set(el,nh);
      if(oh==null||!el.classList.contains('on')||Math.abs(nh-oh)<3||Math.abs(nh-oh)>700||!el.animate)return;
      busy.add(el);
      // запускаем анимацию вне колбэка наблюдателя, чтобы не было ошибки «ResizeObserver loop»
      requestAnimationFrame(()=>{try{const o=el.style.overflow;el.style.overflow='hidden';
        const an=el.animate([{height:oh+'px'},{height:nh+'px'}],{duration:380,easing:'cubic-bezier(.22,1,.36,1)'});
        const fin=()=>{busy.delete(el);el.style.overflow=o;last.set(el,el.offsetHeight)};an.onfinish=fin;an.oncancel=fin}
        catch(err){busy.delete(el)}})})});
    IDS.forEach(id=>{const el=$i(id);if(el)ro.observe(el)})}
  // при закрытии окна клавиатура уезжает вместе с ним
  const mo=new MutationObserver(ms=>{ms.forEach(m=>{const el=m.target;
      if(el.classList.contains('on')){savedY=window.scrollY;setTimeout(sched,400);setTimeout(sched,800)}
      else if(el.contains(document.activeElement))document.activeElement.blur()});sched()});
  IDS.forEach(id=>{const el=$i(id);if(el)mo.observe(el,{attributes:true,attributeFilter:['class']})});
  sched();
})();
</script>
<script>
// курсор в поле появляется только когда окно/поиск уже доехали и анимация закончилась — не прыгает вместе с ними
(function(){
  const root=document.documentElement;let t=0;
  const hold=ms=>{root.classList.add('nocr');clearTimeout(t);t=setTimeout(()=>root.classList.remove('nocr'),ms)};
  document.addEventListener('focusin',e=>{if(e.target&&e.target.matches&&e.target.matches('input,textarea'))hold(1000)},true);
})();
</script><script>
// ---------- напоминание о резервной копии (раз в неделю, не чаще раза в сутки) ----------
setTimeout(()=>{try{if(tx.length<5)return;const n=Date.now();
  if(cfg.lastBackup&&n-cfg.lastBackup<7*864e5)return;
  if(cfg.backupSnooze&&n<cfg.backupSnooze)return;
  if(typeof isModalOpen==='function'&&isModalOpen())return;
  cfg.backupSnooze=n+864e5;save();
  toast(cfg.lastBackup?'💾 Копия данных старше недели':'💾 Копии данных ещё нет','Сохранить',()=>openBq('save'),'save')}catch(e){}},3500);
// ---------- PWA: офлайн-режим (service worker) ----------
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
