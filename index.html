  const set=()=>{el.classList.add('nt');
    if(l)el.setAttribute('data-theme','light');else el.removeAttribute('data-theme');
    const tc=document.getElementById('tc');if(tc)tc.content=l?'#e4e4e1':'#111111';if(window.tgChrome)window.tgChrome(l);
    void el.offsetWidth;requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove('nt')))};
  if(!anim||(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)){set();return}
  const sh=document.createElement('div');sh.style.cssText='position:fixed;inset:0;z-index:13;pointer-events:none;opacity:1;transition:opacity .34s ease;background:'+getComputedStyle(document.body).backgroundColor;
  document.body.appendChild(sh);set();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{sh.style.opacity='0';setTimeout(()=>sh.remove(),420)}))}

// ================= Облачная синхронизация через Telegram CloudStorage =================
// Данные → JSON → gzip (если есть CompressionStream, иначе без сжатия) → base64 → куски по 3800 символов
// в ключи d0, d1, … ; служебный ключ meta (число кусков, время сохранения, контрольные суммы) пишется ПОСЛЕДНИМ.
// Вне Telegram (IN_TG=false) всё это не запускается: приложение работает с локальным хранилищем, как раньше.
const CLK={chunk:3800,maxKeys:1000,timeout:15000};
// короткий хэш строки (cyrb53) — для контроля целостности и сравнения «одинаковые ли данные»
const cloudHs=str=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
// хэш данных без «служебных» полей, которые меняются сами (напоминания о копии)
const cloudHash=()=>{const c={...cfg};['backupSnooze','lastBackup','notified','ratesAt','ratesErr'].forEach(k=>delete c[k]);return cloudHs(JSON.stringify({tx,cfg:c,learn}))};
const cloudHas=()=>tx.length>0||cfg.goals.length>0||cfg.debts.length>0||(cfg.rec||[]).length>0||cfg.budget>0||Object.keys(cfg.bm||{}).length>0||cfg.custom.length>0;

// ---- индикатор: сохранено / синхронизация / ошибка ----
const CS_TXT={ok:'сохранено',sync:'синхронизация',err:'ошибка'};
function csSet(st,msg){CL.st=st;const el=$('#cs');if(!el)return;el.dataset.s=st;const t=el.querySelector('.csl');if(t)t.textContent=CS_TXT[st];
  el.title=msg||'';el.setAttribute('aria-label','Облако Telegram: '+CS_TXT[st]+(msg?'. '+msg:''))}

// ---- обёртка над CloudStorage: промис + таймаут ----
function csCall(m,...a){return new Promise((ok,no)=>{let fin=false;
  const tm=setTimeout(()=>{if(!fin){fin=true;no(new Error('timeout'))}},CLK.timeout);
  try{TGW.CloudStorage[m](...a,(err,res)=>{if(fin)return;fin=true;clearTimeout(tm);err?no(new Error(String(err))):ok(res)})}
  catch(e){if(!fin){fin=true;clearTimeout(tm);no(e)}}})}

// ---- упаковка: gzip + base64, запасной вариант — без сжатия (только ASCII, чтобы символы = байты) ----
async function cloudPack(json){let z=0,body=null;
  try{if(typeof CompressionStream==='function'&&typeof Blob==='function'){
    const u8=new Uint8Array(await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
    let b='';for(let i=0;i<u8.length;i+=0x8000)b+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
    body=btoa(b);z=1}}catch{body=null;z=0}
  if(!body){z=0;body=json.replace(/[\u0080-\uffff]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'))}
  return {z,body}}
async function cloudUnpack(body,z){let json;
  if(z){if(typeof DecompressionStream!=='function')throw Object.assign(new Error('nodecomp'),{nodecomp:1});
    const bin=atob(body),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    json=await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
  else json=body;
  return JSON.parse(json)}

// ---- чтение ----
async function cloudMeta(){const r=await csCall('getItem','meta');if(!r)return null;
  let m;try{m=JSON.parse(r)}catch{return {bad:1}}
  if(!m||!(m.n>0)||!(m.t>0)||m.n>CLK.maxKeys)return {bad:1};
  return m}
async function cloudRead(m){const keys=[];for(let i=0;i<m.n;i++)keys.push('d'+i);
  const parts=new Array(m.n);
  for(let i=0;i<keys.length;i+=20){const b=keys.slice(i,i+20),r=(await csCall('getItems',b))||{};b.forEach((k,j)=>{parts[i+j]=r[k]||''})}
  if(parts.some(p=>!p))throw Object.assign(new Error('chunks missing'),{corrupt:1});
  const body=parts.join('');
  if(m.c&&cloudHs(body)!==m.c)throw Object.assign(new Error('checksum'),{corrupt:1});
  let d;try{d=await cloudUnpack(body,m.z)}catch(e){if(e&&e.nodecomp)throw e;throw Object.assign(new Error('parse'),{corrupt:1})}
  if(!d||!Array.isArray(d.tx))throw Object.assign(new Error('format'),{corrupt:1});
  return d}

// ---- запись: куски → meta (последней) → удаление лишних старых кусков ----
async function cloudPush(){const t=Date.now(),hNow=cloudHash(),json=JSON.stringify(collectData());
  const {z,body}=await cloudPack(json);
  const chunks=[];for(let i=0;i<body.length;i+=CLK.chunk)chunks.push(body.slice(i,i+CLK.chunk));
  if(chunks.length>CLK.maxKeys)throw Object.assign(new Error('STORAGE_KEYS_TOO_MUCH'),{limit:1});
  let idx=0;const worker=async()=>{while(idx<chunks.length){const i=idx++;try{await csCall('setItem','d'+i,chunks[i])}catch(e){idx=1e9;throw e}}};
  await Promise.all([worker(),worker(),worker()]);
  await csCall('setItem','meta',JSON.stringify({v:1,n:chunks.length,t,z,c:cloudHs(body),h:hNow}));
  CL.lh=hNow;if(CL.lt<=t){CL.lt=t;cloudPersist()}      // правки во время отправки получат время позже t и уйдут следующим кругом
  try{const ks=(await csCall('getKeys'))||[];
    const stale=ks.filter(k=>/^d\d+$/.test(k)&&Number(k.slice(1))>=chunks.length);
    for(let i=0;i<stale.length;i+=50)await csCall('removeItems',stale.slice(i,i+50))}catch{}}

// ---- загрузка из облака и применение ----
async function cloudPull(m){const hb=cloudHash();let d;
  try{d=await cloudRead(m)}
  catch(e){if(!(e&&e.corrupt))throw e;
    await new Promise(r=>setTimeout(r,1500));      // возможно, другое устройство как раз дописывает куски
    try{const m2=await cloudMeta();if(m2&&!m2.bad)m=m2;d=await cloudRead(m)}
    catch(e2){if(e2&&e2.corrupt&&cloudHas()){await cloudPush();return}throw e2}}
  if(cloudHash()!==hb){await cloudPush();return}   // пока читали, пользователь внёс правки — они важнее
  if(isModalOpen()){CL.retryT=setTimeout(()=>cloudSync('modal'),2500);return 'defer'}   // не меняем данные под открытым окном
  try{if(tx.length){const b=JSON.stringify(collectData());if(b.length<9e5)localStorage.setItem('finapp.bak',b)}}catch{}   // страховка: прежние локальные данные
  applyData(d,{replace:true});
  CL.lt=m.t;cloudPersist();CL.lh=cloudHash();
  try{if(applyRec())render()}catch{}
  /* тихо: статус виден в индикаторе #cs */}

// ---- слияние: правки на двух устройствах объединяются, а не затирают друг друга ----
function cloudBase(h){if(!h)return;CL.sb=h;try{localStorage.setItem('finapp.synch',h)}catch{}}
function mergeCloudData(d){
  CL.mute=true;
  try{
    const dc=_obj(d.cfg)?d.cfg:{},now=Date.now(),old=now-400*864e5,del={};
    [dc.del,cfg.del].forEach(o=>{if(_obj(o))Object.entries(o).forEach(([k,v])=>{v=+v||0;if(v>old&&v>(del[k]||0))del[k]=v})});
    const dead=id=>id!=null&&del[String(id)]!=null;
    // операции: объединение по id; одна и та же — берём правку посвежее (u), при равенстве — локальную
    const cl=new Map();_okArr(d.tx,_obj).forEach(t=>{if(t.id!=null&&t.id!=='')cl.set(String(t.id),t)});
    const out=[],seen=new Set(),rk=new Set();
    const put=t=>{const id=String(t.id);if(dead(id))return;
      if(t.rid){const k=t.rid+'|'+t.date;if(rk.has(k)){del[id]=now;return}rk.add(k)}   // одна и та же повторяющаяся запись, созданная на двух устройствах
      out.push(t)};
    tx.forEach(t=>{const id=String(t.id);seen.add(id);const c=cl.get(id);put(c&&(+c.u||0)>(+t.u||0)?c:t)});
    cl.forEach((c,id)=>{if(!seen.has(id))put(c)});
    // списки с id (цели, долги, повторы, свои категории): объединение, при совпадении — локальная версия
    const un=(a,b)=>{const o=[],sn=new Set();_okArr(a).concat(_okArr(b)).forEach(x=>{const id=x&&x.id!=null?String(x.id):'';if(!id||sn.has(id)||dead(id))return;sn.add(id);o.push(x)});return o};
    const arr=(a,b)=>[...new Set([...(Array.isArray(a)?a:[]),...(Array.isArray(b)?b:[])])];
    const mg={...dc,...cfg};                                  // одиночные настройки: выигрывают локальные
    ['goals','debts','rec','custom'].forEach(k=>{mg[k]=un(cfg[k],dc[k])});
    ['rates','limits','catOv','bm','rman'].forEach(k=>{mg[k]={...(_obj(dc[k])?dc[k]:{}),...(_obj(cfg[k])?cfg[k]:{})}});
    ['cc','curList','tplHide'].forEach(k=>{mg[k]=arr(cfg[k],dc[k])});
    mg.del=del;
    cfg=mg;tx=out;learn={...(_obj(d.learn)?d.learn:{}),...learn};
    normState();buildAll();snapTx(false);save()}
  finally{CL.mute=false}
  applyTheme(false);render();renderSt()}
async function cloudMerge(m){
  const d=await cloudRead(m);                               // повреждено/дописывается → ошибка → повтор позже
  if(isModalOpen()){CL.retryT=setTimeout(()=>cloudSync('modal'),2500);return 'defer'}   // не меняем данные под открытым окном
  try{if(tx.length){const b=JSON.stringify(collectData());if(b.length<9e5)localStorage.setItem('finapp.bak',b)}}catch{}   // страховка: локальные данные до слияния
  mergeCloudData(d);
  CL.lt=Date.now();cloudPersist();
  await cloudPush();
  try{if(applyRec())render()}catch{}
  /* тихо */}

// ---- ошибки ----
function cloudErr(e){const m=String((e&&e.message)||e||'');
  if(e&&e.nodecomp)return {t:'fatal',m:'Облачные данные сжаты, а это устройство не умеет их распаковывать. Откройте приложение на другом устройстве или обновите Telegram.'};
  if((e&&e.limit)||/KEYS_TOO_MUCH|LENGTH_INVALID|VALUE_INVALID|QUOTA|TOO_MUCH|TOO_LARGE/i.test(m))return {t:'limit',m:'Данные не помещаются в облако Telegram (лимит: 1024 ключа по 4096 символов). Сделайте экспорт JSON и удалите старые операции.'};
  if(navigator.onLine===false||/offline|timeout|network|fetch|failed|connect/i.test(m))return {t:'net',m:'Нет связи с облаком Telegram. Данные сохранены на устройстве, синхронизация повторится сама.'};
  if(e&&e.corrupt)return {t:'other',m:'Облачные данные повреждены или записаны не до конца. Повторю позже.'};
  return {t:'other',m:'Ошибка облака Telegram: '+m.slice(0,80)}}
function cloudFail(e){const x=cloudErr(e);CL.fails++;const first=CL.errShown!==x.t;CL.errShown=x.t;CL.lastErr=x;
  csSet('err',x.m);if(CL.manual)toast('⚠ '+x.m);   // сообщение — только если сами нажали на индикатор; иначе тихо, повтор в фоне
  void first;
  if(x.t==='net'||x.t==='other')CL.retryT=setTimeout(()=>cloudSync('retry'),Math.min(60000,5000*Math.pow(2,Math.min(CL.fails-1,4))))}

// ---- автосохранение: через ~1 секунду после любого изменения данных ----
function cloudSoon(){CL.pending=true;if(CL.st!=='sync')csSet('sync');clearTimeout(CL.timer);
  CL.timer=setTimeout(()=>{CL.pending=false;cloudSync('save')},1000)}

// ---- главная сверка: читаем meta и решаем — загрузить из облака, отправить в облако или ничего ----
async function cloudSync(why){
  if(!IN_TG||!CL.on)return;
  if(CL.busy){CL.again=true;return}
  CL.busy=true;CL.again=false;CL.pending=false;clearTimeout(CL.timer);clearTimeout(CL.retryT);csSet('sync');
  const h0=cloudHash();let ok=false,defer=false;
  try{
    if(navigator.onLine===false)throw new Error('offline');
    let m=await cloudMeta();
    const hNow=cloudHash(),edited=hNow!==h0;       // правки, сделанные, пока шёл запрос
    if(m&&m.bad)m=null;
    let r;
    const base=CL.sb,lch=!!base&&hNow!==base,cch=!!base&&!!m&&m.h!==base;   // менялось ли что-то у нас / в облаке с прошлой сверки
    if(!m){if(cloudHas())await cloudPush();else CL.lh=hNow}                // в облаке пусто
    else if(m.h===hNow){CL.lt=m.t;cloudPersist();CL.lh=hNow}               // данные уже одинаковые
    else if(lch&&cch)r=await cloudMerge(m);                                // менялось и у нас, и в облаке — объединяем
    else if(base&&cch&&!lch&&!edited)r=await cloudPull(m);                 // изменилось только в облаке (часы устройств не важны)
    else if(base&&lch&&!cch)await cloudPush();                             // изменилось только у нас
    else if(!edited&&m.t>CL.lt)r=await cloudPull(m);                       // основы нет (первый запуск после обновления): новее по времени
    else await cloudPush();                                                // локальная новее (или равна, но изменена)
    if(r==='defer')defer=true;
    else{ok=true;cloudBase(CL.lh);CL.lastSync=Date.now();CL.fails=0;CL.lastErr=null;CL.errShown='';csSet('ok','');if(CL.manual)toast('Облако Telegram: всё сохранено')}
  }catch(e){cloudFail(e)}
  finally{
    CL.busy=false;CL.manual=false;
    if(!CL.ready){CL.ready=true;                    // первая сверка закончилась: правки, сделанные за это время, не теряем
      if(CL.pre){CL.pre=false;if(cloudHash()!==(ok?CL.lh:h0)){CL.lt=Date.now();cloudPersist();CL.again=true}}}
    if(CL.again&&!defer)setTimeout(()=>cloudSync('again'),300)}}

// ---- запуск ----
(function(){
  if(!IN_TG)return;
  const el=$('#cs');
  if(el)el.addEventListener('click',()=>{
    if(!CL.on){toast(CL.lastErr?CL.lastErr.m:'Облако Telegram недоступно');return}
    if(CL.busy){toast('Синхронизация уже идёт');return}
    CL.manual=true;cloudSync('manual')});
  document.addEventListener('visibilitychange',()=>{if(!CL.on)return;
    if(document.hidden){if(CL.pending){clearTimeout(CL.timer);CL.pending=false;cloudSync('hide')}}
    else if(Date.now()-CL.lastSync>20000)cloudSync('resume')});
  window.addEventListener('pagehide',()=>{if(CL.on&&CL.pending){clearTimeout(CL.timer);CL.pending=false;cloudSync('hide')}});
  window.addEventListener('online',()=>{if(CL.on)cloudSync('online')});
  try{TGW.onEvent('activated',()=>{if(CL.on&&Date.now()-CL.lastSync>20000)cloudSync('resume')})}catch{}
  // тема Telegram (светлая/тёмная) и безопасные отступы меняются на лету
  try{TGW.onEvent('themeChanged',()=>{if(cfg.theme==='auto')applyTheme(true)})}catch{}
  try{['safeAreaChanged','contentSafeAreaChanged'].forEach(ev=>TGW.onEvent(ev,fitSoon))}catch{}
  if(!(TGW.isVersionAtLeast&&TGW.isVersionAtLeast('6.9'))||!TGW.CloudStorage){
    const m='Эта версия Telegram не поддерживает облачное хранилище (нужна 6.9+). Данные хранятся только на устройстве.';
    CL.lastErr={t:'fatal',m};csSet('err',m);return}
  CL.on=true;cloudSync('start')})();

// ================= автокурсы: open.er-api.com =================
// Курс записывается в каждую операцию в момент создания (поле rt) — обновление курса прошлое не трогает.
// Курс, который вы ввели руками (в окне валют или фразой «курс евро 19.5»), помечен в cfg.rman и автообновлением не перезаписывается:
// чтобы вернуть автокурс для валюты, очистите поле курса.
const RATES_URL='https://open.er-api.com/v6/latest/',RATES_TTL=12*3600e3;
const ratesAuto=()=>cfg.autoRates!==false;
// ответ API: {result:'success', rates:{USD:0.0575,…}} — сколько единиц валюты за 1 основную → нам нужно «1 единица валюты = N основной»
function ratesFromApi(j,base,want){
  if(!j||j.result!=='success'||!j.rates||typeof j.rates!=='object')return null;
  const out={};
  for(const c of want){if(c===base)continue;const r=Number(j.rates[c]);if(r>0&&isFinite(r)){const v=Math.round(1e6/r)/1e6;if(v>0)out[c]=v}}
  return out}
function ratesWanted(){
  const s=new Set([...(cfg.curList||[]),...needRate,...tx.map(t=>t.oc).filter(Boolean),...Object.keys(cfg.rates||{}).filter(k=>parseFloat(cfg.rates[k])>0)]);
  s.delete(cfg.cur);return[...s].filter(c=>/^[A-Z]{3}$/.test(c))}
let _ratesBusy=null;
function ratesRefresh(force){

  if(_ratesBusy)return force?_ratesBusy.then(()=>ratesRefresh(true)):_ratesBusy;

      const want=ratesWanted();
      if(!want.length){cfg.ratesErr='';return true}
      const ctl=typeof AbortController==='function'?new AbortController():null,tm=setTimeout(()=>{try{ctl&&ctl.abort()}catch{}},9000);
      let r;try{r=await fetch(RATES_URL+encodeURIComponent(cfg.cur),{signal:ctl?ctl.signal:undefined,cache:'no-store'})}finally{clearTimeout(tm)}

  const ttl={date:'Изменить даты',note:'Изменить заметки',tags:'Изменить теги'}[kind]+' · '+n;
  gd.innerHTML=`<div class="eh"><b>${ttl}</b><button class="x" id="bkx" type="button" aria-label="Закрыть" style="font-size:20px;padding:4px 6px">×</button></div>${h}<div class="shf"><span></span><button class="sm pr" id="bkok" type="button">Применить</button></div>`;
  gd._bk={kind,ids,mode:'add'};lockBg(true);cancelGestures();

  setTimeout(()=>{const i=$('#bkv');if(i&&kind!=='date')i.focus()},380)}
function bkClose(){gd._bk=null;gd.classList.remove('on');if(!isModalOpen()){ov.className='';try{lockBg(false)}catch(e){}}try{cancelGestures()}catch(e){}}
gd.addEventListener('click',e=>{const k=gd._bk;if(!k)return;
  const b=e.target.closest('button');if(!b)return;e.stopPropagation();

  if(b.dataset.bm){k.mode=b.dataset.bm;gd.querySelectorAll('[data-bm]').forEach(x=>x.classList.toggle('on',x===b));const w=$('#bkw');if(w)w.style.display=k.mode==='clr'?'none':'';return}
  if(b.id==='bkok'){const v=($('#bkv')||{}).value||'';sel.keys=new Set(k.ids);const kind=k.kind,mode=k.mode;
    if(kind==='date'&&!/^\d{4}-\d\d-\d\d$/.test(v)){toast('Выберите дату');return}
    bkClose();
    if(kind==='date'){month=v.slice(0,7);applyBulk(t=>{t.date=v},'Дата изменена')}
    else if(kind==='note')applyBulk(t=>{t.note=v.trim()||cd(t.category).n},'Заметки изменены');
    else applyBulk(t=>{if(mode==='clr'){delete t.tags;return}if(mode==='set')t.tags=[];addTags(t,v);if(!t.tags.length)delete t.tags},'Теги изменены')}},true);
gd.addEventListener('keydown',e=>{if(gd._bk&&e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();e.stopPropagation();$('#bkok').click()}},true);
window.AppSel={exit,enter};

    if(e.target.closest('.tr-skip')){a.kind==='wel'?finishWelcome('skip'):end('skip');return}
    a.kind==='wel'?welNext():next()});
  // свайп: влево — дальше, вправо — назад; работает и в знакомстве, и в подсказках по экрану. Кнопки и касание «Далее» остаются.
  // На последнем шаге свайп вперёд ничего не закрывает (закрыть можно кнопкой), чтобы обучение не завершалось случайно.
  const trSwipe=dir=>{const a=active;if(!a)return;tapAt=Date.now();
    if(a.kind==='wel'){
      if(dir>0){if(a.i<a.list.length-1){try{hap.sw('select')}catch(e){}welNext()}}
      else if(a.i>0){try{hap.sw('select')}catch(e){}welGo(a.i-1)}}
    else if(a.kind==='spot'){
      if(dir>0){if(a.i<a.steps.length-1){try{hap.sw('select')}catch(e){}next()}}
      else if(a.i>0){try{hap.sw('select')}catch(e){}prev()}}};
  let tsw=null;
  root.addEventListener('touchstart',e=>{if(e.touches.length!==1){tsw=null;return}const t=e.touches[0];tsw={x:t.clientX,y:t.clientY,t:performance.now(),done:false}},{passive:true});
  root.addEventListener('touchmove',e=>{
    if(!tsw||tsw.done||e.touches.length!==1)return;
    const t=e.touches[0],dx=t.clientX-tsw.x,dy=t.clientY-tsw.y,ax=Math.abs(dx),ay=Math.abs(dy);
    if(ax>=44&&ax>ay*1.4){tsw.done=true;trSwipe(dx<0?1:-1)}          // жест засчитан сразу, как палец прошёл порог
    else if(ay>=16&&ay>ax*1.4)tsw=null},{passive:true});            // явно вертикальное движение — не свайп
  root.addEventListener('touchend',e=>{
    const s0=tsw;tsw=null;if(!s0||s0.done)return;
    const t=e.changedTouches[0],dx=t.clientX-s0.x,dy=t.clientY-s0.y,ax=Math.abs(dx),ay=Math.abs(dy);
    if(ax>=30&&ax>ay*1.4&&(ax>=44||performance.now()-s0.t<260))trSwipe(dx<0?1:-1)},{passive:true});   // короткий быстрый «щелчок» пальцем тоже считается
  root.addEventListener('touchcancel',()=>{tsw=null},{passive:true});
  // мышь (Telegram Desktop): перетаскивание
  let msw=null;
  root.addEventListener('pointerdown',e=>{msw=(e.pointerType==='mouse'&&e.button===0)?{x:e.clientX,y:e.clientY}:null});
  root.addEventListener('pointerup',e=>{const s0=msw;msw=null;if(!s0||e.pointerType!=='mouse')return;
    const dx=e.clientX-s0.x,dy=e.clientY-s0.y;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.4)trSwipe(dx<0?1:-1)});
  D.addEventListener('keydown',e=>{if(!active)return;
    if(e.key==='Escape'){e.preventDefault();e.stopPropagation();active.kind==='wel'?finishWelcome('skip'):end('skip')}
    else if(e.key==='ArrowRight'){e.preventDefault();e.stopPropagation();active.kind==='wel'?welNext():next()}
    else if(e.key==='ArrowLeft'&&active.kind==='wel'&&active.i>0){e.preventDefault();e.stopPropagation();welGo(active.i-1)}
    else if(e.key==='Tab'&&!root.contains(D.activeElement)){e.preventDefault();(active.kind==='wel'?wNext:cNext).focus({preventScroll:true})}},true);
}

/* ---------- знакомство ---------- */
function runWelcome(news){
  if(active)return false;
  build();prep();
  const list=news?NEWSL:SL;fillSlides(list);
  active={id:news?'news':'welcome',kind:'wel',i:0,list,news:!!news};
  // чистое состояние: анимации первого слайда проигрываются заново, как в первый раз
  wSls.forEach(x=>x.classList.remove('on','prev'));wDots.forEach(d=>d.classList.remove('on'));
  wSkip.style.visibility='';hole.style.opacity='';
  wSls[0].style.transform='none';   // первый слайд только проявляется вместе с окном, без бокового сдвига
  root.className='on wel';void root.offsetWidth;
  welGo(0);
  return true}
function welGo(i){
  const a=active;if(!a||a.kind!=='wel')return;a.i=i;
  if(i>0)wSls[0].style.transform='';
  wSls.forEach((s,k)=>{s.classList.toggle('on',k===i);s.classList.toggle('prev',k<i)});
  wDots.forEach((d,k)=>d.classList.toggle('on',k===i));
  const L=a.list.length-1;
  wNext.textContent=i===L?(a.news?'Понятно':'Начать'):'Далее';
  wSkip.style.visibility=i===L||(a.news&&L<1)?'hidden':''}
function welNext(){const a=active;if(!a||a.kind!=='wel')return;a.i<a.list.length-1?welGo(a.i+1):finishWelcome('done')}
function finishWelcome(kind){
  if(!active||active.kind!=='wel')return;
  const news=active.news;active=null;
  if(news){mark('new16');root.classList.remove('on','wel');cool=Date.now()+900;return}
  if(kind==='skip'){
    mark(ALL);root.classList.remove('on','wel');cool=Date.now()+900;
    return}
  mark(['welcome','new16']);
  // знакомство уходит, и сразу начинается разбор главного экрана
  root.classList.remove('wel');
  const g=gen;
  setTimeout(()=>{if(g!==gen||active)return;if(!runTour('list',{first:true})){root.classList.remove('on');cool=Date.now()+900}},420)}

/* ---------- подсказки по экранам ---------- */
function resolve(s){
  let el=null;try{el=typeof s.t==='function'?s.t():qa(s.t)}catch(e){}
  if(!el||!el.getClientRects().length)return null;
  const r=el.getBoundingClientRect();return r.width>0&&r.height>0?el:null}

function prep(){
  try{if(typeof closeSettings==='function')closeSettings()}catch(e){}
  const a=D.activeElement;if(a&&a!==D.body&&a.blur&&a!==q('#tour'))a.blur()}

function runTour(id,opts){
  const def=TOURS[id];if(!def||active)return false;
  const steps=def.steps.filter(s=>resolve(s));
  if(!steps.length){mark(id);return false}
  build();prep();
  active={id,kind:'spot',steps,i:0,miss:0,opts:opts||{}};
  const first=!root.classList.contains('on');
  root.className='on spot';
  if(first||(opts&&opts.first)){ // вырез «вырастает» из центра экрана
    hole.style.transition='none';hole.style.left=innerWidth/2+'px';hole.style.top=innerHeight/2+'px';hole.style.width='0px';hole.style.height='0px';
    void hole.offsetWidth;hole.style.transition=''}
  last='';showStep(true);
  cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
  return true}

function showStep(first){
  const a=active;if(!a||a.kind!=='spot')return;
  const s=a.steps[a.i],n=a.steps.length,swap=!first&&!RM;
  card.classList.toggle('swap',swap);
  clearTimeout(a.sw);
  a.sw=setTimeout(()=>{
    if(active!==a)return;
    cT.textContent=s.title;cX.textContent=s.text;
    cDots.innerHTML=n>1?Array.from({length:n},(_,k)=>`<i class="${k===a.i?'on':''}"></i>`).join(''):'';
    cDots.hidden=n<2;cSkip.hidden=n<2;
    cNext.textContent=n<2?'Понятно':(a.i===n-1?'Готово':'Далее');
    const el=resolve(s);
    if(el){const sc=visible(el);last='';a.side=null;a.force=!sc;a.done=false;place(el,first)}
    card.classList.remove('swap');
  },swap?140:0)}

function next(){const a=active;if(!a||a.kind!=='spot')return;a.i<a.steps.length-1?(a.i++,a.miss=0,showStep(false)):end('done')}
function prev(){const a=active;if(!a||a.kind!=='spot'||a.i<=0)return;a.i--;a.miss=0;showStep(false)}

function end(kind,silent){
  const a=active;if(!a||a.kind!=='spot')return;
  active=null;cancelAnimationFrame(raf);clearTimeout(a.sw);
  if(!silent)mark(a.id);
  cool=Date.now()+1000;
  root.classList.remove('on');
  setTimeout(()=>{if(!active)root.className=''},420);
}

// не прокручиваем крупные цели и закреплённые элементы; остальное подводим к центру
function visible(el){
  if(el.closest('#tabs,#fab,#sh,#stw,.hd'))return false;
  const r=el.getBoundingClientRect(),vh=innerHeight;
  if(r.height>vh*.55)return false;
  if(r.top<pT.offsetHeight+10||r.bottom>vh-pB.offsetHeight-110){el.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'});return true}
  return false}

function place(el,instant){
  const s=active.steps[active.i],r=el.getBoundingClientRect(),key=[r.left,r.top,r.width,r.height].map(Math.round).join();
  // пока цель движется (прокрутка, рост графика), карточка стоит на месте; когда цель замерла — один раз плавно встаёт рядом
  if(!instant&&key===last){const a=active;if(a.rect&&!a.done&&++a.still>=10){a.done=true;placeCard(a.rect,false,true)}return}
  last=key;active.still=0;active.done=false;
  const p=s.pad==null?6:s.pad,x=r.left-p,y=r.top-p,w=r.width+p*2,h=r.height+p*2;
  const br=getComputedStyle(el).borderTopLeftRadius;
  let rad=br.indexOf('%')>-1?Math.min(w,h)/2:(parseFloat(br)||0)+p;
  rad=clamp(Math.max(rad,12),0,Math.min(w,h)/2);
  hole.style.left=x+'px';hole.style.top=y+'px';hole.style.width=w+'px';hole.style.height=h+'px';hole.style.borderRadius=rad+'px';
  active.rect={l:x,t:y,r:x+w,b:y+h};
  placeCard(active.rect,instant,false)}

function placeCard(r,instant,settled){
  // карточка стоит рядом с пунктом: под ним, если там есть место, иначе над ним, а у крупной цели — у верхнего или нижнего края.
  // Сторона выбирается один раз на шаг и меняется, только если перестала помещаться; двигается карточка лишь когда цель замерла.
  const A=active;
  if(!instant&&!settled&&!A.force)return;
  A.force=false;
  const vw=innerWidth,vh=innerHeight,m=12,gap=14,top=pT.offsetHeight+m,bot=vh-pB.offsetHeight-m;
  const cw=card.offsetWidth,ch=card.offsetHeight;
  const x=Math.round(clamp((r.l+r.r)/2-cw/2,m,vw-cw-m));
  const below=bot-(r.b+gap),above=(r.t-gap)-top;
  const fits=k=>k==='below'?below>=ch:k==='above'?above>=ch:true;
  if(!A.side||!fits(A.side))A.side=below>=ch?'below':above>=ch?'above':'dock';
  let y=A.side==='below'?r.b+gap:A.side==='above'?r.t-gap-ch:((r.t+r.b)/2>vh/2?top:bot-ch);
  y=Math.round(clamp(y,top,Math.max(top,bot-ch)));
  if(instant){   // первое появление: чуть опускается сверху и проявляется
    card.style.transition='none';
    card.style.setProperty('--x',x+'px');card.style.setProperty('--y',(y-(RM?0:14))+'px');
    void card.offsetWidth;card.style.transition=''}
  else if(A.cy!=null&&Math.abs(A.cy-y)<3&&A.cx===x)return;
  A.cx=x;A.cy=y;
  card.style.setProperty('--x',x+'px');card.style.setProperty('--y',y+'px')}

// следим за целью каждый кадр: окно выезжает, страница прокручивается, появляется клавиатура — подсветка не отстаёт
function loop(){
  const a=active;if(!a)return;
  if(a.kind==='spot'){
    if(a.id==='sheet'?!q('#sh.on'):modalOpen()){end('abort',true);return}
    const el=resolve(a.steps[a.i]);
    if(el){a.miss=0;place(el)}
    else if(++a.miss>90){a.i<a.steps.length-1?(a.i++,a.miss=0,showStep(false)):end('done')}}
  raf=requestAnimationFrame(loop)}

/* ---------- когда показывать ---------- */
function ctxKey(){
  const t=q('#tabs [aria-current="page"]'),tb=t?t.dataset.t:'list';
  const sb=qa('.sbt button.on'),sub=sb?(sb.dataset.as||sb.dataset.ps||''):'';
  if(tb==='stats')return sub&&sub!=='all'?'stats:'+sub:'stats';
  if(tb==='tags')return sub&&sub!=='goals'?'tags:'+sub:'tags';
  return 'list'}
const gate=()=>!active&&Date.now()>cool&&!D.hidden&&!q('#spl')&&!modalOpen()&&!q('#gear.on')&&!q('#trm.on')&&!q('#fp.open');
let pk='',pa=0,na=0,lastMut=Date.now();
function consider(){
  if(!gate()){na=0;return}
  const S=seen();if(!S.welcome)return;
  // после обновления один раз показываем «Что нового» (экран должен постоять спокойно)
  if(!S.new16){if(!na)na=Date.now();if(Date.now()-na>=1800){na=0;runWelcome(true)}return}
  const key=ctxKey();
  if(S[key]||!TOURS[key]||key==='sheet'){pk='';return}
  if(key!==pk){pk=key;pa=Date.now();return}      // экран должен простоять спокойно, пока не покажем подсказку
  if(Date.now()-pa<600||Date.now()-lastMut<750)return;
  pk='';runTour(key)}

function considerSheet(){
  const sh=q('#sh');if(!sh||!sh.classList.contains('on'))return;
  if(!seen().welcome||seen().sheet||active)return;
  setTimeout(()=>{const sh2=q('#sh');if(sh2&&sh2.classList.contains('on')&&!seen().sheet&&!active&&!q('#spl'))runTour('sheet')},950)}

function boot(){
  const t0=Date.now();
  (function wait(){
    if(Date.now()-t0>12000)return;
    const tg=!!window.__TG&&typeof CL==='object'&&!CL.ready&&Date.now()-t0<4500;  // в Telegram ждём первую сверку с облаком
    if(q('#spl')||tg||D.readyState==='loading')return void setTimeout(wait,200);
    setTimeout(function go(){
      if(seen().welcome)return;
      if(gate()){runWelcome()}else if(Date.now()-t0<12000)setTimeout(go,800)},1200)})();
  // слежение за экранами
  let tm=0;const kick=()=>{lastMut=Date.now();clearTimeout(tm);tm=setTimeout(consider,300)};
  const mo=new MutationObserver(kick);
  [['#body',{childList:true}],['#sbw',{childList:true}],['#tabs',{attributes:true,subtree:true,attributeFilter:['class','aria-current']}]].forEach(([s,o])=>{const e=q(s);if(e)mo.observe(e,o)});
  const sh=q('#sh');if(sh)new MutationObserver(considerSheet).observe(sh,{attributes:true,attributeFilter:['class']});
  startIv()}
let iv=0;
function startIv(){clearInterval(iv);iv=setInterval(()=>{if(ALL.every(k=>seen()[k])){clearInterval(iv);iv=0;return}consider()},500)}

/* ---------- пройти заново / завершить (меню «Обучение» в шапке и настройки) ---------- */
function replay(){
  if(active)return;
  const g=++gen;
  reset();pk='';startIv();   // таймер слежения мог остановиться, когда всё было пройдено, — запускаем снова
  try{if(typeof tab!=='undefined'&&tab!=='list'&&typeof setTab==='function')setTab('list')}catch(e){}
  setTimeout(()=>{const go=()=>{if(g!==gen)return;if(gate())runWelcome();else setTimeout(go,500)};go()},650)}

function stop(){
  gen++;                       // отменяем всё, что ещё ждёт запуска: «пройти заново», переход после знакомства
  const a=active;
  if(a){
    if(a.kind==='spot')end('skip',true);
    else{active=null;if(root)root.classList.remove('on','wel')}}
  mark(ALL);pk='';na=0;        // все подсказки считаются показанными — сами больше не появятся
  cool=Date.now()+900}

window.AppTour={replay,stop,run:runTour,reset,news:()=>{if(active)return;const m=seen();delete m.new16;try{localStorage.setItem(KEY,JSON.stringify(m))}catch(e){}try{if(typeof cfg==='object'&&cfg){cfg.tour=m;if(typeof save==='function')save()}}catch(e){}na=0}};

/* ---------- меню «Обучение» рядом с шестерёнкой ---------- */
function initMenu(){
  const b=D.getElementById('trb'),m=D.getElementById('trm');if(!b||!m)return;
  const isOpen=()=>m.classList.contains('on');
  const open=()=>{
    if(modalOpen())return;
    try{if(typeof closeSettings==='function')closeSettings()}catch(e){}
    m.querySelector('[data-tr=stop]').disabled=!active&&ALL.every(k=>seen()[k]);   // всё уже завершено — нечего завершать
    m.inert=false;m.classList.add('on');b.setAttribute('aria-expanded','true')};
  const close=()=>{if(!isOpen())return;m.classList.remove('on');m.inert=true;b.setAttribute('aria-expanded','false')};
  b.addEventListener('click',()=>{isOpen()?close():open()});
  m.addEventListener('click',e=>{
    const x=e.target.closest('[data-tr]');if(!x||x.disabled)return;
    const k=x.dataset.tr;close();
    if(k==='again')setTimeout(replay,180);else stop()});
  // тап вне меню закрывает его и не доходит до того, что под ним (как у настроек)
  D.addEventListener('pointerdown',e=>{
    if(!isOpen()||e.target.closest('#trm,#trb,#toast'))return;
    close();e.stopPropagation();e.preventDefault();
    try{if(typeof swallowClick==='function')swallowClick()}catch(err){}},true);
  D.addEventListener('keydown',e=>{if(e.key==='Escape'&&isOpen()){e.stopPropagation();close()}},true);
  // открылось другое окно — меню убираем
  new MutationObserver(()=>{if(isOpen()&&(modalOpen()||q('#gear.on')))close()}).observe(D.body,{attributes:true,subtree:true,attributeFilter:['class']})}
if(D.readyState==='loading')D.addEventListener('DOMContentLoaded',boot);else boot();
if(D.readyState==='loading')D.addEventListener('DOMContentLoaded',initMenu);else initMenu();
})();
</script>
</body></html>
