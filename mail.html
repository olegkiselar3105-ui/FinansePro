<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Написать в Finance Pro</title>
<!-- Мост для письма из Telegram: внутри Telegram ссылки mailto: не открываются, поэтому приложение открывает эту страницу
     во внешнем браузере (Telegram.WebApp.openLink), а она уже открывает почту телефона с готовыми адресом и темой.
     Адрес зашит здесь (как SUPPORT.email в index.html) — страницу нельзя использовать для писем на чужие адреса. -->
<style>
:root{color-scheme:light dark;--bg:#f4f5f9;--t:#15161a;--m:#6b6e76;--s:#fff;--b:#2f6df6}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b10;--t:#f2f3f5;--m:#9a9da6;--s:#17181e}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--t);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:420px;background:var(--s);border-radius:24px;padding:24px 20px;text-align:center}
h1{font-size:20px;margin:0 0 6px}
p{margin:0 0 18px;color:var(--m);font-size:14px}
a.go,button{display:block;width:100%;height:50px;border:0;border-radius:14px;font-family:inherit;font-weight:600;font-size:16px;line-height:50px;text-decoration:none;cursor:pointer}
a.go{background:var(--b);color:#fff}
.ad{margin:18px 0 8px;font-size:15px;word-break:break-all}
button{background:transparent;color:var(--b);height:44px;line-height:44px}
</style></head>
<body><main>
<h1>Письмо в Finance Pro</h1>
<p>Сейчас откроется почта с адресом и темой — останется написать сообщение. Если не открылась, нажмите кнопку.</p>
<a class="go" id="go" href="#">Открыть почту</a>
<div class="ad" id="ad"></div>
<button type="button" id="cp">Скопировать адрес</button>
</main>
<script>
(function(){
  var TO='olegkiselar3105@gmail.com';
  var q=new URLSearchParams(location.search),cut=function(v,n){return String(v||'').slice(0,n)};
  var subj=cut(q.get('s'),120)||'Finance Pro — обращение',body=cut(q.get('b'),1000);
  var url='mailto:'+TO+'?subject='+encodeURIComponent(subj)+(body?'&body='+encodeURIComponent(body):'');
  document.getElementById('go').href=url;
  document.getElementById('ad').textContent=TO;
  document.getElementById('cp').onclick=function(){var b=this;
    var ok=function(){b.textContent='Скопировано'};
    try{navigator.clipboard.writeText(TO).then(ok,function(){prompt('Адрес:',TO)})}catch(e){prompt('Адрес:',TO)}};
  // сразу пробуем открыть почту; если браузер требует нажатия — сработает кнопка
  setTimeout(function(){try{location.href=url}catch(e){}},150);
})();
</script>
</body></html>
